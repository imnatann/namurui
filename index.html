<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NamurUI · agent console components</title>
    <meta name="description" content="NamurUI is a React 19 component library for building agent consoles, with components, screens, blocks, illustrations and motion effects." />
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
        // Agent console: dark is the default; only an explicit "light" opts out.
        const dark = t !== "light";
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
